
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- APERTURA DEL SOBRE -->
    <section id="intro" class="intro">

        <div class="intro-content">
            <p class="intro-small">UNA INVITACIÓN ESPECIAL</p>

            <h1>Estás invitado</h1>

            <p class="intro-message">
                Quiero compartir contigo una noche inolvidable
            </p>

            <div class="envelope" id="envelope">

                <div class="envelope-back"></div>

                <div class="letter">
                    <span>TE INVITO A CELEBRAR</span>
                    <strong>Mis XV</strong>
                </div>

                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

                <div class="seal">SM</div>

            </div>

            <p class="open-text" id="openText">
                TOCÁ EL SOBRE PARA ABRIR
            </p>
        </div>

    </section>

    <!-- INVITACIÓN -->
    <main id="invitation" class="hidden">

        <section class="hero">
            <div class="hero-content">
                <p>UNA NOCHE MÁGICA</p>
                <h2>Sofi</h2>
                <h3>MIS QUINCE AÑOS</h3>
                <p>11 · 12 · 2026</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
